enable_native_execution_engine: false
driver_cores: 8
driver_memory: 56g
executor_cores: 8
executor_memory: 56g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 9
spark_conf:
  spark.extraListeners: io.openlineage.spark.agent.OpenLineageSparkListener
  spark.openlineage.transport.type: onelake
  spark.openlineage.transport.folder: lineage_events
  spark.openlineage.transport.workspace: 1cfeab7c-4df3-48cb-8407-c31a3bb8a7e5
  spark.openlineage.transport.lakehouse: 1c93cf41-5b66-4694-9ef0-8ea6d3d89ed4
  spark.openlineage.namespace: fabric
  spark.openlineage.facets.spark.logicalPlan.disabled: true
  spark.openlineage.columnLineage.datasetLineageEnabled: true
  spark.scheduler.listenerbus.eventqueue.shared.capacity: 100000
  spark.openlineage.transport.flushIntervalSeconds: 5
runtime_version: 1.3
